<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Serif+Thai:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f2f5fa; --surface:#ffffff; --ink:#0f1f42; --muted:#5a6784; --line:#d9e1ee;
  --accent:#0052a4; --accent-ink:#ffffff; --gold:#f3c623; --gold-ink:#2b2200;
  --l1:#4a5b82; --l2:#00873f; --l3:#d9650a; --l4:#8250a0; --l5:#0052a4; --l6:#c62a3a; --on-line:#ffffff;
  --hero-a:#0f1f42; --hero-b:#173a78; --hero-ink:#ffffff;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1326; --surface:#16213b; --ink:#eaf0fa; --muted:#9bacc8; --line:#2a3959;
    --accent:#6fb0ff; --accent-ink:#06213f; --gold:#f3c623; --gold-ink:#2b2200;
    --l1:#93a6d2; --l2:#3ecf7f; --l3:#ff9a45; --l4:#c9a0e6; --l5:#66a8ff; --l6:#ff7a88; --on-line:#0b1326;
    --hero-a:#101c3a; --hero-b:#1a3468;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1326; --surface:#16213b; --ink:#eaf0fa; --muted:#9bacc8; --line:#2a3959;
  --accent:#6fb0ff; --accent-ink:#06213f; --gold:#f3c623; --gold-ink:#2b2200;
  --l1:#93a6d2; --l2:#3ecf7f; --l3:#ff9a45; --l4:#c9a0e6; --l5:#66a8ff; --l6:#ff7a88; --on-line:#0b1326;
  --hero-a:#101c3a; --hero-b:#1a3468;
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{overflow-wrap:break-word;word-break:break-word}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Noto Sans KR",system-ui,sans-serif;line-height:1.65;font-size:16px;max-width:440px;width:100%;margin-left:auto;margin-right:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang="en"] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Noto Serif Thai","Noto Sans KR",Georgia,serif;margin:0;line-height:1.25}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,html[lang="en"] .code{font-family:Georgia,"Times New Roman",serif}
html[lang="ko"] h1,html[lang="ko"] h2,html[lang="ko"] h3{font-family:"Noto Sans KR",sans-serif;font-weight:900}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{width:100%;padding:0 14px}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.langs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.langs button{font:inherit;font-size:.85rem;font-weight:700;padding:6px 10px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:36px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.navmenu{position:relative;flex:none}
.navdrop{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(9,20,50,.2);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:180px;z-index:50;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .15s ease, transform .15s ease}
.navdrop.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.navdrop-item{display:flex;align-items:center;gap:10px;padding:13px 12px;min-height:44px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
.navdrop-item:hover,.navdrop-item:focus-visible{background:var(--bg)}
.navdrop-item .ic{font-size:1.15rem;flex:none}
.lbl{display:inline}
.jump{display:flex;gap:6px;align-items:center;flex:1 1 100%;order:3;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a.sec{flex:none;font-size:.88rem;text-decoration:none;color:var(--muted);padding:4px 8px;border-radius:6px}
.jump a.sec:hover{color:var(--ink)}
.jump a.dn{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;text-decoration:none;background:var(--c);color:var(--on-line)}

/* hero */
.hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);position:relative;overflow:hidden}
.hero .wrap{padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:60px;position:relative}
.hero .ghost{position:absolute;right:-4px;top:-4px;font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:5.5rem;line-height:1;color:rgba(255,255,255,.07);pointer-events:none;user-select:none}
.dates{display:inline-flex;gap:8px;align-items:center;background:var(--gold);color:var(--gold-ink);font-weight:700;padding:4px 12px;border-radius:999px;font-size:.85rem}
.hero h1{font-size:2.2rem;font-weight:800;margin:14px 0 8px;letter-spacing:-.01em}
.hero p{margin:0;max-width:100%;opacity:.85;font-size:.96rem}
.lines{display:flex;gap:6px;margin-top:22px}
.lines i{height:6px;flex:1;max-width:56px;border-radius:3px;background:var(--c)}
.hero-links-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hero-btn{margin-top:0;background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-size:.86rem;padding:10px 16px;min-height:44px}
.hero-btn:hover{filter:brightness(1.05)}
.hero-btn.ghost2{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}

/* flights overlapping hero */
.flights{margin-top:-40px;display:grid;grid-template-columns:1fr;gap:12px;position:relative}
.pass{background:var(--surface);border-radius:18px;box-shadow:0 10px 30px rgba(9,20,50,.16);position:relative}
.pass-head{padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px;flex-wrap:wrap}
.pass-head span:last-child{color:var(--muted);font-weight:500;font-size:.92rem}
.route-row{display:flex;align-items:center;gap:8px;padding:8px 12px 12px;flex-wrap:wrap;justify-content:center}
.code{font-family:"Noto Serif Thai",Georgia,serif;font-size:1.6rem;font-weight:800;line-height:1}
.time{font-weight:700;font-size:.92rem}
.city{color:var(--muted);font-size:.78rem;line-height:1.3}
.gap{flex:1;text-align:center;color:var(--muted);font-size:.68rem;line-height:1.2;min-width:44px}
.gap .dash{height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 10px);margin:0 0 5px}
.rt{text-align:right}
.perf{border-top:2px dashed var(--line);margin:0 12px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.perf::before{left:-23px}.perf::after{right:-23px}
.pass-foot{padding:10px 16px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pass-foot .small{flex:1 1 140px}
.small{color:var(--muted);font-size:.88rem;line-height:1.45}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:9px 14px;min-height:42px;border-radius:999px;font-size:.9rem;white-space:nowrap;border:1.5px solid var(--accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn svg{width:15px;height:15px;flex:none}

h2.sec{font-size:1.3rem;margin:36px 0 12px}
.sub{color:var(--muted);margin:-6px 0 22px;max-width:100%}

/* stay */
.stay{background:var(--surface);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr;box-shadow:0 4px 18px rgba(9,20,50,.07)}
.stay .key{background:var(--gold);color:var(--gold-ink);padding:14px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:8px;font-weight:800;text-align:center;min-width:auto}
.stay .key b{font-size:1.5rem;line-height:1}
.stay .key span{font-size:.8rem;font-weight:700}
.stay .info{padding:16px}
.stay h3{font-size:1.25rem;margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr;gap:2px 0;margin:0 0 14px;font-size:.95rem}
.kv dt{color:var(--muted);margin-top:10px;font-size:.82rem}
.kv dd{margin:0 0 2px;overflow-wrap:anywhere}
.tipbox{margin-top:12px;font-size:.92rem;color:var(--muted);padding-left:14px;border-left:3px solid var(--gold)}

/* day timeline */
.day{--c:var(--l1);margin:0 0 42px}
.day-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.badge{flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:var(--on-line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 5px var(--bg),0 0 0 8px var(--c)}
.badge span{font-size:.62rem;font-weight:700;opacity:.9;margin-bottom:2px}
.badge b{font-size:1.2rem;font-weight:800}
.day-head h3{font-size:1.15rem}
.day-head .small{font-size:.92rem}
.route{margin-left:20px;border-left:6px solid var(--c);padding:16px 0 4px 26px;position:relative}
.day-note{margin:0 0 16px;color:var(--muted);max-width:100%}
.stn{position:relative;display:flex;gap:12px;margin:0 0 22px}
.stn .mark{position:absolute;left:-41px;top:2px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:5px solid var(--c);display:flex;align-items:center;justify-content:center}
.stn input{position:absolute;left:-41px;top:2px;width:24px;height:24px;margin:0;opacity:0;cursor:pointer;z-index:1}
.stn input:checked + .mark{background:var(--c)}
.stn input:checked + .mark::after{content:"";width:6px;height:11px;border:solid var(--on-line);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.stn input:focus-visible + .mark{outline:3px solid var(--gold);outline-offset:2px}
.stn .txt{flex:1;min-width:0}
.stn .top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;min-height:32px}
.stn .name{flex:1 1 160px;min-width:0;font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.stn input:checked ~ .txt .name{color:var(--muted);text-decoration:line-through}
.time-chip{flex:none;font-size:.82rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid var(--c);color:var(--ink);background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;min-height:28px}
.time-chip.main{background:var(--c);color:var(--on-line)}
.desc{margin:6px 0 4px;color:var(--ink);font-size:.95rem;line-height:1.65;max-width:100%}
.hrs{margin:0;color:var(--muted);font-size:.85rem;line-height:1.5}
.utag{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:700;color:#8a6100;background:color-mix(in srgb, var(--gold) 30%, transparent);padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.hrs b{color:var(--ink);font-weight:700}
.stn.ev{margin-bottom:14px}
.stn.ev .mark{width:14px;height:14px;left:-36px;top:8px;border-width:3px}
.stn.ev .name{font-weight:400;font-size:.95rem;color:var(--muted)}
.stn.ev .top{min-height:28px}
.checks{margin:0 0 8px;padding-left:20px}
.checks li{margin:0 0 8px;max-width:100%}
.tip{margin:6px 0 10px;font-size:.92rem;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.terminus{position:absolute;left:-14px;bottom:-4px;width:22px;height:8px;border-radius:4px;background:var(--c)}

.note{background:var(--surface);border-radius:14px;padding:14px 18px;margin:8px 0}
.note ul{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:.93rem}
footer{margin:24px 0 calc(40px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.85rem}

@media (max-width:380px){
  .wrap{padding:0 12px}
  .hero h1{font-size:1.8rem}
  .hero .ghost{font-size:4rem}
  .code{font-size:1.35rem}
  .route{margin-left:14px;padding-left:20px}
  .stn .mark,.stn input{left:-35px}
  .stn.ev .mark{left:-30px}
}
@media (max-width:340px){
  .hero h1{font-size:1.6rem}
  .hero-btn,.btn{font-size:.82rem;padding:8px 12px}
}
</style>

var navToggle = document.getElementById("navToggle");
var navDrop = document.getElementById("navDrop");
function closeNavDrop(){ navDrop.classList.remove("open"); navToggle.setAttribute("aria-expanded","false"); }
function openNavDrop(){ navDrop.classList.add("open"); navToggle.setAttribute("aria-expanded","true"); }
navToggle.addEventListener("click", function(e){
  e.stopPropagation();
  if (navDrop.classList.contains("open")) closeNavDrop(); else openNavDrop();
});
navDrop.addEventListener("click", function(e){ e.stopPropagation(); });
document.querySelectorAll(".navdrop-item").forEach(function(a){ a.addEventListener("click", closeNavDrop); });
document.addEventListener("click", closeNavDrop);
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeNavDrop(); });

render();
</script>
</body>
</html>
